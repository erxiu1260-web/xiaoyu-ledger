<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8668f">
<title>小鱼的记账本</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" media="print" onload="this.media='all'">
<style>
:root{--paper:#fff7f9;--dot:#f8dbe3;--card:#fff;--ink:#4f3640;--muted:#9b7884;--line:#f1d6de;--pink:#e8668f;--deep:#b8466d;
  --f-display:"ZCOOL KuaiLe","YouYuan","PingFang SC","Microsoft YaHei",cursive;--f-body:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--paper:#24171d;--dot:#3a2530;--card:#2f1f27;--ink:#ffe8ef;--muted:#c39cab;--line:#4a2f3c;--deep:#ffb3cb;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);line-height:1.6;
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:20px 20px;
  padding:40px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font-family:var(--f-display);font-weight:400;color:var(--deep);font-size:32px;margin:0;text-align:center}
p.sub{margin:-12px 0 0;text-align:center;color:var(--muted);font-size:14px}
.go{display:block;text-align:center;text-decoration:none;background:var(--pink);color:#fff;border-radius:16px;padding:16px;
  font-family:var(--f-display);font-size:22px;box-shadow:0 4px 0 var(--deep)}
.go small{display:block;font-family:var(--f-body);font-size:13px;opacity:.9}
.card{background:var(--card);border-radius:14px;padding:16px 18px;box-shadow:0 8px 22px -14px rgba(120,40,70,.35)}
.card h2{font-family:var(--f-display);font-weight:400;font-size:19px;color:var(--deep);margin:0 0 8px}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
li a{display:grid;grid-template-columns:3em 1fr auto;gap:10px;align-items:baseline;padding:10px 0;border-top:1.5px dashed var(--line);color:inherit;text-decoration:none}
li:first-child a{border-top:0}
li a:hover b{color:var(--pink)}
li b{font-weight:800;color:var(--deep)}
li span{min-width:0}
li em{font-style:normal;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.tag{font-size:11px;background:var(--pink);color:#fff;border-radius:99px;padding:1px 7px;margin-left:6px}
.note{font-size:13px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>小鱼的记账本</h1>
  <p class="sub">每个版本都保留着，数据在各版本之间通用</p>
  <a class="go" id="latest" href="v2/">打开最新版<small id="latestLabel">v2</small></a>
  <section class="card">
    <h2>所有版本</h2>
    <ol id="list"><li><a href="v2/"><b>v2</b><span>日历、折线图、统计图</span><em></em></a></li><li><a href="v1/"><b>v1</b><span>第一版：粉色手账风</span><em></em></a></li></ol>
  </section>
  <p class="note">账本数据只存在你自己的浏览器里，别人看不到</p>
</div>
<script>
fetch('versions.json',{cache:'no-store'}).then(r=>r.json()).then(vs=>{
  vs=[].concat(vs).sort((a,b)=>b.v-a.v);if(!vs.length)return;
  const top=vs[0];document.getElementById('latest').href='v'+top.v+'/';
  document.getElementById('latestLabel').textContent='v'+top.v+(top.note?' · '+top.note:'');
  const ol=document.getElementById('list');ol.textContent='';
  vs.forEach((v,i)=>{const li=document.createElement('li'),a=document.createElement('a');a.href='v'+v.v+'/';
    const b=document.createElement('b');b.textContent='v'+v.v;
    const s=document.createElement('span');s.textContent=v.note||'';if(i===0){const t=document.createElement('span');t.className='tag';t.textContent='最新';s.append(t)}
    const e=document.createElement('em');e.textContent=v.date||'';
    a.append(b,s,e);li.append(a);ol.append(li)});
}).catch(()=>{});
</script>
</body>
</html>
